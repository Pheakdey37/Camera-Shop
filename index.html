<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | AdminHub</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h2>Log in with</h2>

      <div class="social-login">

        <button class="google-btn"><img src="images.jpg"> Google</button>
        <button class="apple-btn"> <img src="download.png">Apple</button>
      </div>

      <p class="or-text">_____________or_____________</p>

      <form id="loginForm">
        <label>Email</label>
        <input type="text" id="email" placeholder="Enter your email" required />

        <label>Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />

        <div class="forgot">
          <a href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="login-btn">Log in</a></button>
      </form>

      <p class="signup-text">
        Don't have an account? <a href="">Sign up</a>
      </p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
