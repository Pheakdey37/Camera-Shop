<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Product Page</title>
 
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #fff;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  width: 90%;
  max-width: 1100px;
  border: 2px solid #ddd;
  padding: 20px;
  border-radius: 10px;
}

header {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 10px;
}

.welcome p {
  font-size: 14px;
  
}

.welcome a {
  color: #000;
  text-decoration: none;
  font-weight: bold;
}

.product-box {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.left-images {
  display: flex;
  flex-direction: column;
  gap: 10px;
}


.thumb {
  width: 80px;
  height: 60px;
  object-fit: contain;
  cursor: pointer;
  border: 1px solid #ccc;
  border-radius: 5px;
  transition: transform 0.2s ease;
}

.main-image img {
  width: 400px;
  height: auto;
  border-radius: 10px;
}

.thumb:hover {
  transform: scale(1.05);
  
}

.product-info {
  width: 35%;
}

.product-info h2 {
  font-size: 28px;
  color: #000;
  margin-bottom: 10px;
}

.product-info p {
  font-size: 16px;
  line-height: 1.5;
  color: #333;
}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="welcome">
        <p>Welcome <br><a href="/assiginment.javascript/login/index.html">Sign in / Register</a></p>
      </div>
    </header>
 
    <div class="product-box">
      <div class="left-images">
        <img src="img1.webp" alt="camera small" class="thumb" onclick="changeImage('img1.webp')">
        <img src="img2.webp" alt="camera small" class="thumb" onclick="changeImage('img2.webp')">
        <img src="img3.webp" alt="camera small" class="thumb" onclick="changeImage('img3.webp')">
        <img src="img4.webp" alt="camera small" class="thumb" onclick="changeImage('img4.webp')">
        <img src="img5.webp" alt="camera small" class="thumb" onclick="changeImage('img5.webp')">
      </div>

      <div class="main-image">
        <img id="mainImg" src="img6.webp" alt="main camera">
      </div>
      <div class="product-info">
        <h2>US $109.00</h2>
        <p>
          7artisans 24mm F1.4 Camera Lens APS-C Manual Focus Prime Lens For Sony E Fuji XF 
          Nikon Z Canon RF/EOS-M M43 Mount Cameras
        </p>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
